<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心镜随记 · 显化情绪辅导助手</title>

<style>
/* ===== CSS Variables & Reset ===== */
:root {
  --bg: #f7f3ef;
  --card-bg: #fdfaf7;
  --text: #4a4458;
  --text-light: #7c7488;
  --text-muted: #a098ae;
  --border: #e6dfd7;
  --pink: #d4a5a5;
  --pink-light: #f0dede;
  --purple: #b8a9c9;
  --purple-light: #e8e0f0;
  --green: #a8c5a0;
  --green-light: #e2efe0;
  --cream: #faf5ef;
  --accent: #c4a882;
  --shadow: 0 2px 12px rgba(120, 100, 100, 0.08);
  --shadow-hover: 0 4px 20px rgba(120, 100, 100, 0.14);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 16px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px 16px 40px;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(212,165,165,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 60%, rgba(184,169,201,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 90%, rgba(168,197,160,0.08) 0%, transparent 50%);
}

.container { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 20px; }

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 24px 20px 12px;
}
.header .date {
  font-size: 14px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.header .quote {
  font-size: 15px;
  color: var(--text-light);
  font-style: italic;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeSlideIn 0.8s 0.2s forwards;
}

@keyframes fadeSlideIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Card Base ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px 22px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: box-shadow var(--transition);
}

/* ===== Journal Area ===== */
.journal-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.journal-label .icon { font-size: 18px; }

.journal-textarea {
  width: 100%;
  min-height: 140px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 15px;
  line-height: 1.8;
  color: var(--text);
  background: var(--cream);
  resize: vertical;
  font-family: inherit;
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
}
.journal-textarea:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(184,169,201,0.2);
}
.journal-textarea::placeholder { color: #c8c0d4; }

.char-count {
  text-align: right;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
}
.char-count.warn { color: var(--pink); }
.char-count.limit { color: #c97070; font-weight: 600; }

/* ===== Emotion Buttons ===== */
.emotion-section {
  margin-top: 4px;
}
.emotion-label {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 10px;
}
.emotion-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.emotion-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition);
  color: var(--text-light);
  white-space: nowrap;
  user-select: none;
}
.emotion-btn:hover {
  border-color: var(--purple);
  background: var(--purple-light);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}
.emotion-btn.active {
  border-color: var(--purple);
  background: var(--purple-light);
  color: #5e4e7a;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(184,169,201,0.3);
}
.emotion-btn .emoji {
  font-size: 18px;
  animation: none;
}
.emotion-btn.active .emoji {
  animation: floatEmoji 1.8s ease-in-out infinite;
}

@keyframes floatEmoji {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ===== Action Buttons ===== */
.actions {
  display: flex;
  gap: 12px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.btn {
  flex: 1;
  min-width: 120px;
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  letter-spacing: 0.3px;
}
.btn-analyze {
  background: linear-gradient(135deg, #c4a882, #b8a08a);
  color: #fff;
  box-shadow: 0 3px 12px rgba(180,150,130,0.3);
}
.btn-analyze:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(180,150,130,0.4);
}
.btn-analyze:active { transform: translateY(0); }

.btn-save {
  background: var(--card-bg);
  color: var(--text);
  border: 1.5px solid var(--border);
}
.btn-save:hover {
  border-color: var(--purple);
  background: var(--purple-light);
  transform: translateY(-2px);
}
.btn-history {
  width: 100%;
  padding: 10px 20px;
  border-radius: 25px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  color: var(--text-light);
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
}
.btn-history:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

/* ===== Save Toast ===== */
.save-toast {
  text-align: center;
  font-size: 14px;
  color: var(--accent);
  padding: 10px;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.5s;
  pointer-events: none;
}
.save-toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ===== Response Area ===== */
.response-area {
  display: none;
  opacity: 0;
  transform: translateY(12px);
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.response-area.visible {
  display: block;
  animation: responseIn 0.5s forwards;
}
@keyframes responseIn {
  to { opacity: 1; transform: translateY(0); }
}

.response-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px 22px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.response-module {
  margin-bottom: 20px;
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  border-left: 3px solid transparent;
  animation: moduleIn 0.4s forwards;
  opacity: 0;
}
.response-module:nth-child(1) { animation-delay: 0.1s; }
.response-module:nth-child(2) { animation-delay: 0.2s; }
.response-module:nth-child(3) { animation-delay: 0.3s; }

@keyframes moduleIn {
  from { opacity: 0; transform: translateX(-12px); }
  to { opacity: 1; transform: translateX(0); }
}

.module-affirmation {
  background: linear-gradient(135deg, #fdf2f2, #faf5f5);
  border-left-color: var(--pink);
}
.module-soothe {
  background: linear-gradient(135deg, #f7f3fa, #faf7fc);
  border-left-color: var(--purple);
}
.module-action {
  background: linear-gradient(135deg, #f4f8f2, #f8faf6);
  border-left-color: var(--green);
}

.module-header {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 10px;
}
.module-header .module-icon { font-size: 20px; }
.module-body {
  font-size: 15px;
  line-height: 1.9;
  color: var(--text);
  white-space: pre-wrap;
}

/* ===== Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(60,50,60,0.35);
  backdrop-filter: blur(4px);
  z-index: 100;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 16px;
  overflow-y: auto;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 28px 24px;
  width: 100%;
  max-width: 560px;
  box-shadow: 0 12px 40px rgba(60,50,60,0.2);
  animation: modalIn 0.3s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.modal-header h3 { font-size: 18px; color: var(--text); }
.modal-close {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card-bg);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: all var(--transition);
}
.modal-close:hover { background: var(--pink-light); color: var(--pink); }

.history-list { display: flex; flex-direction: column; gap: 10px; max-height: 55vh; overflow-y: auto; }
.history-item {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all var(--transition);
  background: var(--cream);
}
.history-item:hover {
  border-color: var(--purple);
  box-shadow: var(--shadow-hover);
  transform: translateY(-1px);
}
.history-item .hi-time { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.history-item .hi-emotions { font-size: 13px; color: var(--text-light); margin-bottom: 4px; }
.history-item .hi-preview { font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.history-empty {
  text-align: center;
  color: var(--text-muted);
  padding: 40px 20px;
  font-size: 15px;
}

.history-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  justify-content: flex-end;
}
.history-actions .btn-sm {
  padding: 6px 14px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  font-size: 13px;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  color: var(--text-light);
}
.history-actions .btn-sm:hover { border-color: var(--purple); background: var(--purple-light); }
.history-actions .btn-sm.danger:hover { border-color: var(--pink); background: var(--pink-light); color: #c97070; }

/* ===== AI Settings ===== */
.ai-section {
  margin-top: 12px;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
}
.ai-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.ai-toggle-label {
  font-size: 13px;
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 6px;
}
.toggle-switch {
  position: relative;
  width: 44px; height: 24px;
  background: #d5cfdf;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.3s;
  flex-shrink: 0;
}
.toggle-switch.on { background: var(--purple); }
.toggle-switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 20px; height: 20px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.3s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}
.toggle-switch.on::after { transform: translateX(20px); }
.ai-key-row {
  display: none;
  margin-top: 10px;
  gap: 8px;
  align-items: center;
}
.ai-key-row.show { display: flex; }
.ai-key-input {
  flex: 1;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: var(--cream);
  color: var(--text);
  outline: none;
  font-family: inherit;
  transition: border-color 0.3s;
}
.ai-key-input:focus { border-color: var(--purple); }
.ai-key-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  display: none;
}
.ai-key-hint.show { display: block; }
.ai-key-hint a { color: var(--purple); }
.ai-status { font-size: 12px; padding: 4px 0; min-height: 18px; }
.ai-status.ok { color: var(--green); }
.ai-status.err { color: var(--pink); }

/* ===== AI Provider Tabs ===== */
.ai-provider-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.ai-provider-tab {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  font-size: 13px;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s;
  font-family: inherit;
  color: var(--text-light);
}
.ai-provider-tab.active {
  border-color: var(--purple);
  background: var(--purple-light);
  color: #5e4e7a;
  font-weight: 600;
}
.ai-provider-tab:hover {
  border-color: var(--purple);
}

/* ===== Context badge in response ===== */
.context-badge {
  display: inline-block;
  background: var(--purple-light);
  color: #5e4e7a;
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .container { gap: 14px; }
  .card { padding: 18px 14px; }
  .emotion-btn { padding: 6px 12px; font-size: 13px; }
  .emotion-btn .emoji { font-size: 16px; }
  .actions { flex-direction: column; }
  .btn { width: 100%; }
  .journal-textarea { min-height: 120px; font-size: 14px; }
  .header { padding: 16px 12px 8px; }
  .response-card { padding: 18px 14px; }
  .response-module { padding: 12px 14px; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="date" id="headerDate"></div>
    <div class="quote" id="headerQuote"></div>
  </div>

  <!-- Journal Card -->
  <div class="card">
    <div class="journal-label">
      <span class="icon">📝</span> 今日随记
    </div>
    <textarea
      class="journal-textarea"
      id="journalInput"
      placeholder="在这里写下你此刻的感受、想法或任何你想说的... 你的每一句话都值得被看见。"
      maxlength="800"
    ></textarea>
    <div class="char-count" id="charCount">0 / 800</div>

    <div class="emotion-section">
      <div class="emotion-label">💭 此刻的心情（可多选）</div>
      <div class="emotion-grid" id="emotionGrid"></div>
    </div>

    <!-- AI 增强开关 -->
    <div class="ai-section">
      <div class="ai-toggle-row">
        <span class="ai-toggle-label">🤖 AI 增强分析</span>
        <div class="toggle-switch" id="aiToggle" title="开启后使用 AI 生成个性化回应"></div>
      </div>
      <div class="ai-provider-tabs" id="aiProviderTabs" style="display:none;">
        <button class="ai-provider-tab active" data-provider="dashscope">🪷 阿里百炼（免费）</button>
        <button class="ai-provider-tab" data-provider="deepseek">🔥 DeepSeek</button>
      </div>
      
      <div class="ai-key-row" id="aiKeyRow">
        <input class="ai-key-input" id="aiKeyInput" type="password" placeholder="输入阿里百炼 API Key（每月免费 200 万 tokens）" />
        <button class="btn-sm" id="btnSaveKey" style="flex-shrink:0;">保存</button>
      </div>
      <div class="ai-key-hint" id="aiKeyHint">
        免费获取 Key：<a href="https://bailian.console.aliyun.com/?apiKey=1" target="_blank">阿里百炼控制台</a>（实名后每月免费 200 万 tokens，国内直连）
      </div>
      <div class="ai-status" id="aiStatus"></div>
    </div>

    <div class="actions">
      <button class="btn btn-analyze" id="btnAnalyze">✨ 分析并显化</button>
      <button class="btn btn-save" id="btnSave">💾 仅保存</button>
    </div>
  </div>

  <!-- Save Toast -->
  <div class="save-toast" id="saveToast"></div>

  <!-- Response Area -->
  <div class="response-area" id="responseArea">
    <div class="response-card" id="responseCard"></div>
  </div>

  <!-- History Button -->
  <button class="btn-history" id="btnHistory">📖 查看历史</button>
    <button class="btn-history" id="btnExport" style="font-size:0.7rem;">💾 导出备份</button>
    <button class="btn-history" id="btnImport" style="font-size:0.7rem;">📥 导入备份</button>
    <input type="file" id="importFile" accept=".json" style="display:none;">
</div>

<!-- History Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>📚 过往随记</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
// ============================================================
// 心镜随记 · 显化情绪辅导助手 — 规则引擎 & 前端逻辑
// ============================================================

// ---- 疗愈短句库 ----
const QUOTES = [
  '你不需要完美，也值得被温柔以待。',
  '此刻的呼吸，就是你与自己的连接。',
  '慢慢来，你已经在路上了。',
  '敏感不是弱点，是你感知世界的天赋。',
  '今天你做的最勇敢的事，就是来到这里。',
  '允许自己停一停，花开有时，你也一样。',
  '你的感受都是真实的，不需要解释。',
  '温柔地对待自己，就像对待最好的朋友。',
  '不必急着"好起来"，存在本身就有意义。',
  '你已经做得很好了，我为你感到骄傲。',
  '有些日子就是这样，它不会定义你是谁。',
  '休息是一种生产力，好好照顾自己是第一位。',
];

// ---- 情绪按钮定义 ----
const EMOTIONS = [
  { emoji: '😢', label: '低落', key: 'down' },
  { emoji: '😡', label: '愤怒', key: 'angry' },
  { emoji: '😰', label: '焦虑', key: 'anxious' },
  { emoji: '😶', label: '麻木/解离', key: 'numb' },
  { emoji: '🥹', label: '委屈', key: 'hurt' },
  { emoji: '😤', label: '挫败', key: 'frustrated' },
  { emoji: '😄', label: '开心', key: 'happy' },
  { emoji: '🌈', label: '感恩', key: 'grateful' },
  { emoji: '✨', label: '平静', key: 'calm' },
];

// ---- 关键词 → 情绪映射表（15+ 情绪词汇） ----
const KEYWORD_EMOTION_MAP = {
  // 低落 / 抑郁
  down: ['低落','抑郁','难过','悲伤','难过','消沉','沉闷','不开心','没劲','无力','疲惫','累','空虚','孤独','寂寞','无助','绝望','想哭','哭','沉重','黑暗','没希望','失去','没意义'],
  // 愤怒
  angry: ['愤怒','生气','恼火','讨厌','烦人','暴躁','炸裂','火大','冒火','可恶','受不了','气死','发怒','怒吼','不爽'],
  // 焦虑
  anxious: ['焦虑','紧张','不安','担心','害怕','恐慌','恐惧','惊恐','忐忑','心神不宁','坐立不安','心悸','失控','不确定','未知','未来','失眠','睡不着','胡思乱想','停不下来'],
  // 麻木 / 解离
  numb: ['麻木','解离','不真实','恍惚','漂','游离','空白','无感','没有感觉','抽离','旁观','梦','隔着一层','没反应','反应迟钝','迟钝','呆滞','关机','空白感'],
  // 委屈
  hurt: ['委屈','冤枉','不公平','被误解','被忽视','被冷落','受伤','心碎','不被理解','被伤害','难过','哭','为什么','偏心','不公','凭什么'],

function initHeader() {

// ---- 情绪按钮 ----
function initEmotionButtons() {
  const grid = document.getElementById('emotionGrid');
  EMOTIONS.forEach((em, idx) => {
    const btn = document.createElement('button');
    btn.className = 'emotion-btn';
    btn.innerHTML = `<span class="emoji">${em.emoji}</span> ${em.label}`;
    btn.dataset.key = em.key;
    btn.addEventListener('click', () => toggleEmotion(em.key, btn));
    grid.appendChild(btn);
  });
}

function toggleEmotion(key, btn) {
  const idx = selectedEmotions.indexOf(key);
  if (idx > -1) {
    selectedEmotions.splice(idx, 1);
    btn.classList.remove('active');
  } else {
    if (selectedEmotions.length >= 3) {
      // 自动移除最早选中的
      const oldest = selectedEmotions.shift();
      const oldBtn = document.querySelector(`.emotion-btn[data-key="${oldest}"]`);
      if (oldBtn) oldBtn.classList.remove('active');
    }
    selectedEmotions.push(key);
    btn.classList.add('active');
  }
}

// ---- 分析并显化 ----
async function handleAnalyze() {
  const text = document.getElementById('journalInput').value.trim();
  const emotions = [...selectedEmotions];
  const responseArea = document.getElementById('responseArea');
  const responseCard = document.getElementById('responseCard');

  // 边缘情况：无文字也无情绪
  if (!text && emotions.length === 0) {
    responseCard.innerHTML = buildResponse('default', [], '', []);
    showResponse(responseArea);
    responseCard.querySelector('.response-module').insertAdjacentHTML('afterbegin',
      '<p style="color:#c4a882;margin-bottom:12px;font-size:14px;">💛 你还没有写下任何内容呢～没关系，有时候开始是最难的一步。试试写下一个词，哪怕只是"今天"，就已经是一个很棒的开始了。</p>'
    );
    return;
  }

  // 如果没有选情绪，从文本推断
  let finalEmotions = emotions;
  if (finalEmotions.length === 0 && text) {
    finalEmotions = inferEmotions(text);
    if (finalEmotions.length > 0) {
      finalEmotions.forEach(key => {
        const btn = document.querySelector(`.emotion-btn[data-key="${key}"]`);
        if (btn) {
          btn.classList.add('active');
          if (!selectedEmotions.includes(key)) selectedEmotions.push(key);
        }
      });
    }
  }

  // 提取场景/事件上下文
  const contexts = text ? extractContext(text) : [];

  // AI 模式
  if (aiEnabled && text) {
    const needsKey = aiProvider === 'dashscope' ? !dashscopeApiKey : !deepseekApiKey;
    if (needsKey) {
      const name = aiProvider === 'dashscope' ? '阿里百炼' : 'DeepSeek';
      responseCard.innerHTML = `
        <div class="response-module module-affirmation" style="margin-bottom:12px;">
          <div class="module-header"><span class="module-icon">⚠️</span> ${name} 未配置 API Key</div>
          <div class="module-body" style="color:var(--pink);">请填入 ${name} API Key 后使用 AI 功能。</div>
        </div>`;
      showResponse(responseArea);
      return;
    }

    const providerLabel = aiProvider === 'dashscope' ? '阿里百炼' : 'DeepSeek';
    responseCard.innerHTML = `
      <div class="response-module module-affirmation">
        <div class="module-header"><span class="module-icon">🤖</span> AI 正在分析（${providerLabel}）...</div>
        <div class="module-body" style="color:var(--text-muted);">正在连接 ${providerLabel}...</div>
      </div>`;
    showResponse(responseArea);

    try {
      const prompt = buildAIPrompt(text, finalEmotions, contexts);
      const aiText = await callAI(prompt);
      responseCard.innerHTML = parseAIResponse(aiText, contexts, providerLabel);
      showResponse(responseArea);
    } catch (err) {
      // 降级到规则引擎
      const fallbackHtml = buildResponse(
        finalEmotions.length > 0 ? finalEmotions[0] : 'default',
        finalEmotions, text, contexts
      );
      responseCard.innerHTML = `
        <div class="response-module module-affirmation" style="margin-bottom:12px;">
          <div class="module-header"><span class="module-icon">⚠️</span> AI 请求失败，已切换规则引擎</div>
          <div class="module-body" style="color:var(--pink);">${escapeHtml(err.message)}</div>
        </div>
        ${fallbackHtml}`;
      showResponse(responseArea);
    }
    return;
  }

  // 规则引擎模式
  responseCard.innerHTML = buildResponse(
    finalEmotions.length > 0 ? finalEmotions[0] : 'default',
    finalEmotions,
    text,
    contexts
  );
  showResponse(responseArea);
}

// 解析 AI 返回的文本，拆分为三个模块
function parseAIResponse(aiText, contexts, providerLabel = 'AI') {
  let aff = '', soothe = '', action = '';

  // 按【】分割
  const parts = aiText.split(/【(.+?)】/);
  for (let i = 1; i < parts.length; i += 2) {
    const label = parts[i];
    const content = (parts[i + 1] || '').trim();
    if (label.includes('显化') || label.includes('肯定')) {
      aff = content;
    } else if (label.includes('安抚') || label.includes('情绪')) {
      soothe = content;
    } else if (label.includes('行动') || label.includes('方案')) {
      action = content;
    }
  }

  // 如果分割失败，把全部内容放安抚区
  if (!aff && !soothe && !action) {
    soothe = aiText;
  }

  const ctxBadge = contexts.length > 0
    ? `<span class="context-badge">📌 关联场景：${contexts.map(k => CONTEXT_KEYWORD_MAP[k]?.label || k).join('、')}</span>`
    : '';

  const aiBadge = `<div style="text-align:center;margin-bottom:12px;font-size:0.75rem;color:var(--text-muted);">✨ 由 ${providerLabel} AI 实时生成</div>`;

  return `
    ${aiBadge}
    <div class="response-module module-affirmation">
      <div class="module-header"><span class="module-icon">💫</span> 显化肯定语</div>
      ${ctxBadge}
      <div class="module-body">${(aff || '我正在学习更深入地看见自己。每一天我都在更靠近真实的自己。').replace(/\n/g, '<br>')}</div>
    </div>
    <div class="response-module module-soothe">
      <div class="module-header"><span class="module-icon">🧠</span> 情绪安抚（CPTSD / ADHD）</div>
      <div class="module-body">${(soothe || '你此刻的感受都是真实且有效的。给自己一点时间，也给自己一点耐心。').replace(/\n/g, '<br>')}</div>
    </div>
    <div class="response-module module-action">
      <div class="module-header"><span class="module-icon">🌿</span> 微小行动方案</div>
      <div class="module-body">${(action || '1. 停下来，喝一口水。\n2. 把手放在心口，慢慢呼吸三次。').replace(/\n/g, '<br>')}</div>
    </div>
  `;
}

function showResponse(area) {
  area.classList.remove('visible');
  void area.offsetWidth; // reflow
  area.classList.add('visible');
  area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ---- 构建回应（规则引擎 + 场景上下文） ----
function buildResponse(primaryEmotion, allEmotions, text, contexts) {
  const html = [];

  // 场景上下文标签
  const ctxBadge = contexts.length > 0
    ? `<span class="context-badge">📌 关联场景：${contexts.map(k => CONTEXT_KEYWORD_MAP[k]?.label || k).join('、')}</span>`
    : '';

  // 1) 显化肯定语
  const affirmations = AFFIRMATION_TEMPLATES[primaryEmotion] || AFFIRMATION_TEMPLATES.default;
  let affText = affirmations[Math.floor(Math.random() * affirmations.length)];

  // 如果有场景上下文，追加场景相关的肯定语
  if (contexts.length > 0) {
    const ctxHints = contexts
      .filter(k => CONTEXT_AFFIRMATION_HINTS[k])
      .map(k => CONTEXT_AFFIRMATION_HINTS[k]);
    if (ctxHints.length > 0) {
      affText += '\n\n' + ctxHints[Math.floor(Math.random() * ctxHints.length)];
    }
  }

  html.push(`
    <div class="response-module module-affirmation">
      <div class="module-header"><span class="module-icon">💫</span> 显化肯定语</div>
      ${ctxBadge}
      <div class="module-body">${affText}</div>
    </div>
  `);

  // 2) 情绪安抚
  let sootheHtml = '';
  const hasNumb = allEmotions.includes('numb');
  const hasFrustrated = allEmotions.includes('frustrated');
  const triggeredKw = ['创伤','闪回','噩梦','触发','过去的','小时候','回忆涌','突然想起'];
  const hasTriggered = triggeredKw.some(kw => text.includes(kw));

  if (hasNumb && SOOTHE_TEMPLATES.numb) {
    sootheHtml += `<p>${SOOTHE_TEMPLATES.numb.grounding.replace(/\n/g, '<br>')}</p>`;
  }
  if (hasFrustrated && SOOTHE_TEMPLATES.frustrated) {
    // 如果有场景上下文，让微任务与场景关联
    let microTask = SOOTHE_TEMPLATES.frustrated.microtask;
    if (contexts.length > 0) {
      const ctxLabel = CONTEXT_KEYWORD_MAP[contexts[0]]?.label || '';
      microTask = microTask.replace(
        '你不需要"做好"，你只需要"开始 2 分钟"',
        `你不需要一次性面对与${ctxLabel}相关的所有事，你只需要"开始 2 分钟"`
      );
    }
    sootheHtml += `<p>${microTask.replace(/\n/g, '<br>')}</p>`;
  }
  if (hasTriggered && SOOTHE_TEMPLATES.triggered) {
    sootheHtml += `<p>${SOOTHE_TEMPLATES.triggered.container.replace(/\n/g, '<br>')}</p>`;
  }
  if (!sootheHtml) {
    sootheHtml = `<p>${SOOTHE_TEMPLATES.default.general.replace(/\n/g, '<br>')}</p>`;
  }

  html.push(`
    <div class="response-module module-soothe">
      <div class="module-header"><span class="module-icon">🧠</span> 情绪安抚（CPTSD / ADHD）</div>
      <div class="module-body">${sootheHtml}</div>
    </div>
  `);

  // 3) 微小行动方案（优先使用场景关联建议）
  let actions;
  if (contexts.length > 0) {
    // 优先从场景关联中取
    const ctxActionLists = contexts
      .filter(k => CONTEXT_ACTIONS[k])
      .map(k => CONTEXT_ACTIONS[k]);
    if (ctxActionLists.length > 0) {
      // 合并多个场景的建议，随机取 2 条
      const merged = ctxActionLists.flat();
      const shuffled = [...merged].sort(() => Math.random() - 0.5);
      actions = shuffled.slice(0, 2);
    } else {
      actions = (ACTION_TEMPLATES[primaryEmotion] || ACTION_TEMPLATES.default).slice(0, 2);
    }
  } else {
    actions = ACTION_TEMPLATES[primaryEmotion] || ACTION_TEMPLATES.default;
    const count = Math.min(2, actions.length);
    actions = [...actions].sort(() => Math.random() - 0.5).slice(0, count);
  }

  // 确保永远有至少 1 条
  if (!actions || actions.length === 0) {
    actions = ACTION_TEMPLATES.default.slice(0, 2);
  }

  const actionHtml = actions.map((a, i) => `<p>${i + 1}. ${a}</p>`).join('');

  html.push(`
    <div class="response-module module-action">
      <div class="module-header"><span class="module-icon">🌿</span> 微小行动方案</div>
      <div class="module-body">${actionHtml}</div>
    </div>
  `);

  return html.join('');
}

// ---- 情绪推断（规则引擎） ----
function inferEmotions(text) {
  const scores = {};
  for (const [emotion, keywords] of Object.entries(KEYWORD_EMOTION_MAP)) {
    let score = 0;
    for (const kw of keywords) {
      if (text.includes(kw)) {
        score += kw.length >= 3 ? 3 : 1; // 长词匹配权重更高
      }
    }
    if (score > 0) scores[emotion] = score;
  }
  // 按分数排序，取前 2 个
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  return sorted.slice(0, 2).map(([em]) => em);
}

// ---- 场景/事件提取（让建议与具体内容关联） ----
function extractContext(text) {
  const scores = {};
  for (const [ctxKey, ctxData] of Object.entries(CONTEXT_KEYWORD_MAP)) {
    let score = 0;
    for (const kw of ctxData.keywords) {
      if (text.includes(kw)) {
        score += kw.length >= 3 ? 3 : 1;
      }
    }
    if (score > 0) scores[ctxKey] = score;
  }
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  return sorted.slice(0, 2).map(([key]) => key);
}

// ---- AI 增强：阿里百炼 + DeepSeek ----
let aiEnabled = false;
let aiProvider = 'dashscope';   // 'dashscope' | 'deepseek'
let dashscopeApiKey = '';
let deepseekApiKey = '';

// 初始化 AI 设置
function initAI() {

      keyHint.innerHTML = '免费获取 Key：<a href="https://platform.deepseek.com/api_keys" target="_blank">DeepSeek 开放平台</a>（注册即送 10 元额度，国内直连）';
    }

  function updateAIStatus() {
    if (aiProvider === 'dashscope') {
      if (dashscopeApiKey) {
        status.textContent = '✅ 阿里百炼 API Key 已就绪（每月免费 200 万 tokens）';
        status.className = 'ai-status ok';
      } else {
        status.textContent = '🔑 请注册阿里百炼并填入 API Key（每月免费 200 万 tokens）';

      }

      if (deepseekApiKey) {

        status.className = 'ai-status ok';

      }

  // Provider 标签切换

    tab.classList.toggle('active', tab.dataset.provider === aiProvider);
    tab.addEventListener('click', () => {
      aiProvider = tab.dataset.provider;
      localStorage.setItem('xinjing_ai_provider', aiProvider);
      providerTabs.querySelectorAll('.ai-provider-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      syncKeyUI();
      updateAIStatus();
    });

  // 主开关
  toggle.addEventListener('click', () => {

// 调用阿里百炼 API（每月免费 200 万 tokens，国内直连）
async function callDashscope(prompt) {
  const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${dashscopeApiKey}`,
    },
    body: JSON.stringify({
      model: 'qwen-turbo',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.8,
      max_tokens: 800,
    }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.message || err.error?.message || `百炼请求失败 (${resp.status})`);
  }
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || '';
}

// 调用 DeepSeek API（国内直连，兼容 OpenAI 格式）
async function callDeepSeek(prompt) {
  const resp = await fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${deepseekApiKey}`,
    },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.8,
      max_tokens: 800,
    }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `DeepSeek 请求失败 (${resp.status})`);
  }
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || '';
}

// 调用 AI（根据 provider 选择引擎）
async function callAI(prompt) {
  return aiProvider === 'dashscope' ? callDashscope(prompt) : callDeepSeek(prompt);
}

// 构建 AI 提示词
function buildAIPrompt(text, emotions, contexts) {
  const emotionLabels = emotions.map(k => {
    const found = EMOTIONS.find(e => e.key === k);
    return found ? `${found.emoji}${found.label}` : k;
  }).join('、') || '未标注';

  const contextLabels = contexts.map(k =>
    CONTEXT_KEYWORD_MAP[k]?.label || k
  ).join('、');

  return `你是一位温柔且犀利的情绪辅导专家，专长于 CPTSD 和 ADHD 支持。请严格根据用户今天写的具体内容，给出高度个性化的回应。不要泛泛而谈，必须引用用户提到的名字、事件、地点、细节。

用户当前情绪：${emotionLabels}
涉及场景：${contextLabels || '通用'}
用户随记内容：
"""
${text}
"""

重要——请按以下三段式输出，每段前用【标签】开头：

【显化肯定语】
用第一人称写 2-3 句显化肯定语。必须提到用户随记中的具体细节（人名、事件、物品等），让用户感到"这是专门给我的"。语气温柔坚定。

针对用户所述的具体困扰，给 2-3 句共情安抚。不要泛泛安慰，要直接回应用户提到的情绪点。避免空洞的正能量。

}

// ---- 保存到 localStorage ----
function handleSave() {
  const text = document.getElementById('journalInput').value.trim();
  const emotions = [...selectedEmotions];

  if (!text && emotions.length === 0) {
    showToast('写下点什么吧，哪怕一个词也好 🤍');
    return;
  }

  const entry = {
    id: Date.now(),
    time: new Date().toISOString(),
    text: text,
    emotions: emotions,
  };

  const history = getHistory();
  history.unshift(entry);
  localStorage.setItem('xinjing_journal', JSON.stringify(history));

  showToast('已为您收藏这段时光 🤍');
}

function showToast(msg) {
  const toast = document.getElementById('saveToast');
  toast.textContent = msg;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem('xinjing_journal') || '[]');
  } catch {
    return [];
  }
}

// ---- 导出/导入备份 ----
function exportBackup() {
  const history = getHistory();
  if (history.length === 0) {
    showToast('还没有保存的随记，先写一篇吧 🤍');
    return;
  }
  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    entries: history,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `心镜随记_备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已导出 ${history.length} 条随记到下载文件夹 ✅`);
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.entries || !Array.isArray(data.entries)) {
        throw new Error('格式不正确');
      }
      const existing = getHistory();
      const existingIds = new Set(existing.map(e => e.id));
      let imported = 0;
      data.entries.forEach(entry => {
        if (!existingIds.has(entry.id)) {
          existing.push(entry);
          imported++;
        }
      });
      existing.sort((a, b) => b.id - a.id);
      localStorage.setItem('xinjing_journal', JSON.stringify(existing));
      showToast(`已导入 ${imported} 条随记（跳过 ${data.entries.length - imported} 条重复）✅`);
    } catch (err) {
      showToast(`❌ 导入失败：${err.message}`);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // 允许重复选同一个文件
}

// ---- 历史模态框 ----
function initModal() {
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
}

function openModal() {
  const overlay = document.getElementById('modalOverlay');
  const list = document.getElementById('historyList');
  const history = getHistory();

  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">🌙 还没有保存的随记呢<br>写下今天的第一篇吧</div>';
  } else {
    list.innerHTML = history.map(entry => {
      const d = new Date(entry.time);
      const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const emotionLabels = entry.emotions.map(k => {
        const found = EMOTIONS.find(e => e.key === k);
        return found ? `${found.emoji}${found.label}` : k;
      }).join(' ');
      const preview = entry.text ? entry.text.slice(0, 50) + (entry.text.length > 50 ? '...' : '') : '（无文字内容）';
      return `
        <div class="history-item" data-id="${entry.id}">
          <div class="hi-time">${timeStr}</div>
          <div class="hi-emotions">${emotionLabels || '（未标记情绪）'}</div>
          <div class="hi-preview">${escapeHtml(preview)}</div>
          <div class="history-actions">
            <button class="btn-sm load-btn" data-id="${entry.id}">📋 加载</button>
            <button class="btn-sm danger del-btn" data-id="${entry.id}">🗑 删除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  overlay.classList.add('open');

  // 绑定加载和删除事件
  list.querySelectorAll('.load-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      loadEntry(Number(btn.dataset.id));
    });
  });
  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteEntry(Number(btn.dataset.id));
    });
  });
  list.querySelectorAll('.history-item').forEach(item => {
    item.addEventListener('click', () => loadEntry(Number(item.dataset.id)));
  });
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function loadEntry(id) {
  const history = getHistory();
  const entry = history.find(e => e.id === id);
  if (!entry) return;

  document.getElementById('journalInput').value = entry.text || '';
  document.getElementById('journalInput').dispatchEvent(new Event('input'));

  // 重置情绪选择
  selectedEmotions = [];
  document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('active'));
  if (entry.emotions) {
    entry.emotions.forEach(key => {
      const btn = document.querySelector(`.emotion-btn[data-key="${key}"]`);
      if (btn) {
        btn.classList.add('active');
        selectedEmotions.push(key);
      }
    });
  }

  closeModal();
  document.getElementById('journalInput').focus();
  // 滚动到输入区
  document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
}

function deleteEntry(id) {
  if (!confirm('确定要删除这条随记吗？这个操作不可撤销。')) return;

  let history = getHistory();
  history = history.filter(e => e.id !== id);
  localStorage.setItem('xinjing_journal', JSON.stringify(history));
  openModal(); // 刷新列表
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
